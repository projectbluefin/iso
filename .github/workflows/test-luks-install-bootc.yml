name: LUKS Install End-to-End Test (bootc-iso, experimental)

# Experimental resurrection of the bootc-installer ISO builder from PR #61
# (reverted in #66). Lives entirely under bootc-iso/ and is dispatch-only —
# it must never run on pull_request or a schedule.
on:
  workflow_dispatch:
  # Temporary: branch-scoped push trigger so the workflow can run before the
  # file exists on main (workflow_dispatch only resolves default-branch
  # workflows). Remove before merging.
  push:
    branches: [claude/resurrect-bootc-iso]
    paths: ['bootc-iso/**', '.github/workflows/*bootc*.yml']

permissions:
  issues: write
  pull-requests: write
  contents: write
  actions: read

jobs:
  luks-e2e:
    name: LUKS E2E (${{ matrix.target }}, ${{ matrix.installer_channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        installer_channel: [stable]
        target: [bluefin, bluefin-lts]
    defaults:
      run:
        working-directory: bootc-iso

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure screenshots branch exists
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "/repos/${REPO}/git/refs/heads/ci-screenshots" &>/dev/null; then
            echo "ci-screenshots branch already exists"
          else
            echo "Creating ci-screenshots branch..."
            DEFAULT=$(gh api "/repos/${REPO}" --jq '.default_branch')
            SHA=$(gh api "/repos/${REPO}/git/refs/heads/${DEFAULT}" --jq '.object.sha')
            gh api --method POST "/repos/${REPO}/git/refs" \
              -f "ref=refs/heads/ci-screenshots" \
              -f "sha=${SHA}"
            echo "ci-screenshots branch created from ${DEFAULT}"
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            just podman buildah mtools xorriso \
            qemu-system-x86 ovmf socat sshpass \
            imagemagick -qq

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Configure podman storage (intelligent driver selection)
        run: bash scripts/configure_podman_storage.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # Upstream fisherman main now natively supports direct-mode
      # `bootc install --source-imgref containers-storage:` (the fix that
      # previously lived only in the fix/overlay-driver-for-ostree-bootc-install
      # fork branch), so build from main instead of the fork.
      - name: Clone fisherman
        run: |
          git clone https://github.com/projectbluefin/fisherman.git \
            --branch main \
            --depth 1 \
            /tmp/fisherman

      - name: Build debug ISO
        id: build
        run: |
          START=$(date +%s)
          sudo mkdir -p /var/iso-build
          sudo $(command -v just) debug=1 installer_channel=${{ matrix.installer_channel }} output_dir=/var/iso-build iso-sd-boot ${{ matrix.target }}
          mkdir -p output
          sudo cp /var/iso-build/*.iso output/ 2>/dev/null || true
          sudo chown -R "$USER:$(id -gn)" output/
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          ISO=$(ls output/*.iso 2>/dev/null | head -1)
          echo "iso_size=$(stat -c%s "$ISO" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Fix output directory ownership
        run: sudo chown -R "$USER:$(id -gn)" output/ 2>/dev/null || true

      - name: Run LUKS end-to-end test
        id: luks_test
        env:
          FISHER_REPO: /tmp/fisherman/fisherman
        run: |
          START=$(date +%s)
          just luks-test-qemu ${{ matrix.target }}
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Convert and publish screenshots
        if: always()
        continue-on-error: true
        id: screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sudo chmod a+r /tmp/luks-screenshot-*.ppm /tmp/luks-unlock-snap.ppm 2>/dev/null || true

          commit_png() {
            local src_ppm="$1" label="$2" out_var="$3"
            local png="/tmp/${label}.png"

            convert "$src_ppm" "$png" 2>/dev/null || return 0
            [[ -f "$png" ]] || return 0

            local path_in_repo="luks-e2e/${RUN_ID}/${{ matrix.target }}/${{ matrix.installer_channel }}/${label}.png"
            local existing_sha
            existing_sha=$(gh api "/repos/${REPO}/contents/${path_in_repo}?ref=ci-screenshots" \
              --jq '.sha' 2>/dev/null || echo "")

            local b64_file
            b64_file=$(mktemp)
            base64 -w0 "$png" > "$b64_file"

            jq -n \
              --arg msg "LUKS E2E screenshot: ${label} (run ${RUN_ID})" \
              --rawfile content "$b64_file" \
              --arg branch "ci-screenshots" \
              --arg sha "$existing_sha" \
              'if $sha != "" then
                {message: $msg, content: ($content | rtrimstr("\n")), branch: $branch, sha: $sha}
              else
                {message: $msg, content: ($content | rtrimstr("\n")), branch: $branch}
              end' | \
              gh api --method PUT "/repos/${REPO}/contents/${path_in_repo}" --input - > /dev/null

            rm "$b64_file"
            local url="https://raw.githubusercontent.com/${REPO}/ci-screenshots/${path_in_repo}"
            echo "${out_var}=${url}" >> "$GITHUB_OUTPUT"
            echo "Published ${label} → ${url}"
          }

          commit_png /tmp/luks-screenshot-live.ppm      "live-boot"     "live_url"
          commit_png /tmp/luks-screenshot-plymouth.ppm  "plymouth"      "plymouth_url"
          commit_png /tmp/luks-screenshot-final.ppm     "final-boot"    "final_url"

      - name: Write job summary
        if: always()
        run: |
          RESULT="${{ steps.luks_test.outcome }}"
          CHANNEL="${{ matrix.installer_channel }}"
          TARGET="${{ matrix.target }}"
          ICON=$( [ "$RESULT" = "success" ] && echo "PASS" || echo "FAIL" )
          {
            echo "## ${ICON} LUKS End-to-End Test (${TARGET}, ${CHANNEL}) — ${RESULT}"
            echo ""
            echo "| Step | Value |"
            echo "|------|-------|"
            echo "| ISO size | $(numfmt --to=iec ${{ steps.build.outputs.iso_size }} 2>/dev/null || echo N/A) |"
            echo "| Build time | ${{ steps.build.outputs.duration }}s |"
            echo "| LUKS test time | ${{ steps.luks_test.outputs.duration }}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload serial logs
        if: always()
        run: |
          sudo chmod a+r /tmp/bluefin-qemu-*.log 2>/dev/null || true

      - name: Upload serial logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luks-e2e-serial-logs-${{ matrix.target }}-${{ matrix.installer_channel }}
          path: |
            /tmp/bluefin-qemu-live-serial.log
            /tmp/bluefin-qemu-installed-serial.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if LUKS test failed
        if: steps.luks_test.outcome == 'failure'
        run: |
          echo "::error::LUKS end-to-end test failed — see serial logs and screenshots above"
          exit 1
